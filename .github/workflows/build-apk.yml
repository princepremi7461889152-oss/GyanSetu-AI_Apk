name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | awk -F '.' '{print $1}')
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ -z "$JAVA_MAJOR" ]; then
            echo "Error: Java version could not be detected."
            exit 1
          fi
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Active Java version ($JAVA_MAJOR) is lower than 17."
            exit 1
          fi
          echo "Java environment verification passed (Java $JAVA_MAJOR >= 17)."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            echo "Generating temporary debug keystore..."
            keytool -genkeypair \
              -alias androiddebugkey \
              -keypass android \
              -keystore ./debug.keystore \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          else
            echo "./debug.keystore already exists. Skipping generation."
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "Error: ./debug.keystore could not be created or found."
            exit 1
          fi
          echo "Debug keystore ready."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$TARGET_APK" ]; then
            if [ ! -s "$TARGET_APK" ]; then
              echo "Error: APK file is empty: $TARGET_APK"
              exit 1
            fi
            echo "Found expected APK: $TARGET_APK"
          else
            echo "Error: Expected APK not found at $TARGET_APK"
            echo "Listing APK files discovered in app/build/outputs/apk:"
            find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk" || true
            exit 1
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TMP_DIR=$(mktemp -d)
          cp "app/build/outputs/apk/debug/app-debug.apk" "$TMP_DIR/app-debug.apk"
          if [ ! -f "$TMP_DIR/app-debug.apk" ]; then
            echo "Error: Failed to copy APK to temporary directory."
            exit 1
          fi
          echo "asset_path=$TMP_DIR/app-debug.apk" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset at: $TMP_DIR/app-debug.apk"

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
        run: |
          gh --version

          if [ ! -f "$ASSET_PATH" ]; then
            echo "Error: Asset file not found at $ASSET_PATH"
            exit 1
          fi

          if [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Asset file is empty at $ASSET_PATH"
            exit 1
          fi

          FILENAME=$(basename "$ASSET_PATH")
          if [ "$FILENAME" != "app-debug.apk" ]; then
            echo "Error: Expected asset filename app-debug.apk, but found $FILENAME"
            exit 1
          fi

          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          NOTES=$(cat <<EOF
          ### Automated Debug APK Build

          - **Build Type**: Automatically generated debug APK
          - **Builder**: GitHub Actions
          - **Run Number**: ${{ github.run_number }}
          - **Run Attempt**: ${{ github.run_attempt }}
          - **Commit SHA**: ${{ github.sha }}

          > ⚠️ **Note**: This APK is intended for testing purposes only. It is signed with a temporary debug keystore and is not a Play Store production release.
          EOF
          )

          echo "Creating GitHub Release with tag: $TAG_NAME"
          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --latest
